<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Risk Category Analytics Tool - Interactive Architecture</title>
<style>
  :root { --ink:#1A2A44; --accent:#4FAE6A; --line:#d5dbe5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--ink); background:#f4f6fa; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px;
           padding:10px 20px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav { display:flex; align-items:center; gap:8px; font-size:14px; flex-wrap:wrap; }
  nav button.crumb { all:unset; cursor:pointer; color:#2563eb; text-decoration:underline; }
  nav button.crumb:focus-visible, #back:focus-visible, .clickable:focus-visible { outline:3px solid #2563eb; outline-offset:2px; }
  nav .current { font-weight:bold; }
  nav .sep { color:#9aa3b0; }
  #back { margin-left:auto; padding:6px 14px; border:1px solid var(--line); border-radius:6px;
          background:#fff; cursor:pointer; font-size:14px; color:var(--ink); visibility:hidden; }
  #back:hover { background:#eef3fb; }
  #hint { font-size:13px; background:#eefbf1; border:1px solid var(--accent); border-radius:6px; padding:4px 10px; }
  #hint[hidden] { display:none; }
  main { padding:20px; }
  .view { display:none; margin:0 auto; background:#fff; border:1px solid var(--line);
          border-radius:8px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .view.active { display:block; animation:fade .25s ease; }
  #view-high { max-width:1200px; }
  #view-db { max-width:900px; }
  #view-ntsb, #view-statsum { max-width:760px; }
  #view-avherald-index { max-width:960px; }
  #view-avherald-articles { max-width:1040px; }
  #view-cls, #view-tax { max-width:900px; }
  .view svg { width:100%; height:auto; display:block; }
  @keyframes fade { from { opacity:0; transform:scale(.985);} to { opacity:1; transform:none; } }
  .clickable { cursor:pointer; }
  .clickable > g { transition: filter .15s; }
  .clickable:hover > g, .clickable:focus > g { filter: drop-shadow(0 0 6px #4FAE6A) drop-shadow(0 0 2px #4FAE6A); }
  .pulse-ring { fill:none; stroke:#2563eb; stroke-width:2.5; stroke-dasharray:6 4; pointer-events:none;
                animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .pulse-ring, .view.active { animation:none; } }
</style>
</head>

<g data-cell-id="tax-s5"><rect x="330" y="472" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450.0" y="497.0" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">5. Criteria card</text><text x="450.0" y="515.0" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">include &#183; exclude &#183; examples</text><text x="450.0" y="528.0" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">every line cites a record</text></g>
<g data-cell-id="tax-s6"><rect x="330" y="558" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450.0" y="583.0" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">6. Prove</text><text x="450.0" y="601.0" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">checks G1&#8211;G10</text><text x="450.0" y="614.0" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">blocked &#8594; helper agent (suggests only)</text></g>

<g data-cell-id="tax-s8"><rect x="330" y="730" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450.0" y="755.0" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">8. Version</text><text x="450.0" y="773.0" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">one outcome per bucket &#183; changelog</text><text x="450.0" y="786.0" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">release needs SME approval</text></g>

  <section class="view" id="view-cls" aria-label="Classification pipeline detail">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-0.5 -0.5 900 860"><g>
<!-- title -->
<g data-cell-id="cls-title"><text x="450" y="24" fill="#1A2A44" font-family="Helvetica" font-size="18px" text-anchor="middle" font-weight="bold">Classification Pipeline (component detail)</text></g>
<g data-cell-id="cls-sub"><text x="450" y="46" fill="#5b6b82" font-family="Helvetica" font-size="12px" text-anchor="middle">Standalone, deterministic classifier: records in &#8594; category label(s) + confidence + severity out</text></g>

<!-- ============ GIVEN INPUTS (left column) ============ -->
<g data-cell-id="cls-inputs-group"><rect x="20" y="90" width="230" height="300" rx="16" ry="16" fill="#eef3fb" stroke="#6e8ebe"/><text x="135" y="112" fill="#1A2A44" font-family="Helvetica" font-size="13px" text-anchor="middle" font-weight="bold">Given inputs</text></g>

<g data-cell-id="cls-in-reports"><rect x="45" y="128" width="180" height="70" rx="7" ry="7" fill="#ffffff" stroke="#5b7fb5"/><text x="135" y="156" fill="#1A2A44" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">Report records</text><text x="135" y="174" fill="#1A2A44" font-family="Helvetica" font-size="10px" text-anchor="middle">id &#183; source &#183; text &#183; fields</text><text x="135" y="188" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">(from upstream database)</text></g>

<g data-cell-id="cls-in-tax"><rect x="45" y="212" width="180" height="70" rx="7" ry="7" fill="#ffffff" stroke="#5b7fb5"/><text x="135" y="240" fill="#1A2A44" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">Taxonomy (given)</text><text x="135" y="258" fill="#1A2A44" font-family="Helvetica" font-size="10px" text-anchor="middle">fixed hierarchical label set</text><text x="135" y="272" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">(versioned; external input)</text></g>

<g data-cell-id="cls-in-test"><rect x="45" y="296" width="180" height="70" rx="7" ry="7" fill="#ffffff" stroke="#5b7fb5"/><text x="135" y="324" fill="#1A2A44" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">SME-labeled set</text><text x="135" y="342" fill="#1A2A44" font-family="Helvetica" font-size="10px" text-anchor="middle">train / validation / test</text><text x="135" y="356" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">(ground truth for evaluation)</text></g>

<!-- ============ CLASSIFIER CORE (center column, top to bottom) ============ -->
<g data-cell-id="cls-core-group"><rect x="300" y="90" width="300" height="680" rx="17" ry="17" fill="#eefbf1" stroke="#4fae6a"/><text x="450" y="112" fill="#17331F" font-family="Helvetica" font-size="13px" text-anchor="middle" font-weight="bold">Classifier</text></g>

<g data-cell-id="cls-b1"><rect x="330" y="128" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450" y="153" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">1. Input representation</text><text x="450" y="171" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">embeddings / lexical / structured</text><text x="450" y="184" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">candidate reps &#8212; chosen by benchmark</text></g>

<g data-cell-id="cls-b2"><rect x="330" y="214" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450" y="239" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">2. Classifier model</text><text x="450" y="257" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">binary-relevance / multi-label / hierarchical</text><text x="450" y="270" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">deterministic &#8212; chosen by benchmark</text></g>

<g data-cell-id="cls-b3"><rect x="330" y="300" width="240" height="64" rx="7" ry="7" fill="#ffffff" stroke="#4fae6a"/><text x="450" y="325" fill="#17331F" font-family="Helvetica" font-size="11px" text-anchor="middle" font-weight="bold">3. Calibrated confidence</text><text x="450" y="343" fill="#17331F" font-family="Helvetica" font-size="10px" text-anchor="middle">score in [0,1] + threshold</text><text x="450" y="356" fill="#8a93a3" font-family="Helvetica" font-size="9px" text-anchor="middle">below threshold &#8594; &#8220;unclassified&#8221;</text></g>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  // ---- View graph -------------------------------------------------------
  // Each view: the DOM id, a short breadcrumb label, a URL hash, an optional
  // hint shown in the header, and the drill-down links out of it. A link maps
  // one or more diagram cell ids (data-cell-id) to a target view.
  var VIEWS = {
    high: {
      el: 'view-high',
      label: 'High-level architecture',
      hash: '',
      hint: 'Click the <b>Database</b>, <b>Taxonomy Discovery Pipeline</b> or <b>Classification Pipeline</b> box to drill in',
      links: [
        { cells: ['ingest', 'db'], to: 'db', aria: 'Open source ingestion overview' },
        { cells: ['tax'], to: 'tax', aria: 'Open taxonomy discovery pipeline detail' },
        { cells: ['cls'], to: 'cls', aria: 'Open classification pipeline detail' }
      ]
    },
    db: {
      el: 'view-db',
      label: 'Source ingestion',
      hash: 'ingestion',
      hint: 'Click a <b>collection job</b> (NTSB, AvHerald, or Statsum) to see that source in detail',
      links: [
        { cells: ['ingest'],       to: 'ntsb',              aria: 'Open NTSB ingestion detail' },
        { cells: ['articlefetch'], to: 'avherald-articles', aria: 'Open Aviation Herald article ingestion detail' },
        { cells: ['statsum'],      to: 'statsum',           aria: 'Open ASIS Statsum ingestion detail' }
      ]
    },
    ntsb: {
      el: 'view-ntsb',
      label: 'NTSB ingestion',
      hash: 'ntsb',
      hint: '',
      links: []
    },
    'avherald-articles': {
      el: 'view-avherald-articles',
      label: 'Aviation Herald articles',
      hash: 'avherald-articles',
      hint: 'Click the <b>index-avherald</b> job to see how the article index is built',
      links: [
        { cells: ['index'], to: 'avherald-index', aria: 'Open Aviation Herald index detail' }
      ]
    },
    'avherald-index': {
      el: 'view-avherald-index',
      label: 'Aviation Herald index',
      hash: 'avherald-index',
      hint: '',
      links: []
    },
    statsum: {
      el: 'view-statsum',
      label: 'ASIS Statsum ingestion',
      hash: 'statsum',
      hint: '',
      links: []
    },
    tax: {
      el: 'view-tax',
      label: 'Taxonomy discovery pipeline',
      hash: 'taxonomy',
      hint: 'Candidate buckets in &#8212; grounded, checked, versioned taxonomy out',
      links: []
    },
    cls: {
      el: 'view-cls',
      label: 'Classification pipeline',
      hash: 'classifier',
      hint: 'Standalone deterministic classifier &#8212; records in, labelled assignments out',
      links: []
    }
  };

  var byHash = {};
  Object.keys(VIEWS).forEach(function (k) { byHash[VIEWS[k].hash] = k; });

  var sections = {};
  Object.keys(VIEWS).forEach(function (k) {
    sections[k] = document.getElementById(VIEWS[k].el);
  });

  var back = document.getElementById('back');
  var hint = document.getElementById('hint');
  var crumb = document.getElementById('breadcrumb');

  // Navigation stack of view keys; stack[last] is the visible view.
  var stack = ['high'];

  function current() { return stack[stack.length - 1]; }

  function render() {
    var key = current();
    // Toggle the active section.
    Object.keys(sections).forEach(function (k) {
      sections[k].classList.toggle('active', k === key);
    });

    // Header hint.
    var v = VIEWS[key];
    if (v.hint) { hint.innerHTML = v.hint; hint.hidden = false; }
    else { hint.hidden = true; }

    // Back button.
    back.style.visibility = stack.length > 1 ? 'visible' : 'hidden';

    // Breadcrumb trail from the stack.
    crumb.innerHTML = '';
    stack.forEach(function (k, i) {
      if (i > 0) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.innerHTML = '&rsaquo;';
        crumb.appendChild(sep);
      }
      if (i === stack.length - 1) {
        var cur = document.createElement('span');
        cur.className = 'current';
        cur.textContent = VIEWS[k].label;
        crumb.appendChild(cur);
      } else {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'crumb';
        b.textContent = VIEWS[k].label;
        b.addEventListener('click', (function (depth) {
          return function () { stack = stack.slice(0, depth + 1); sync(); };
        })(i));
        crumb.appendChild(b);
      }
    });

    window.scrollTo(0, 0);
    var hash = VIEWS[key].hash;
    if (history.replaceState) history.replaceState(null, '', hash ? '#' + hash : '#');
  }

  function sync() { render(); }

  function push(key) {
    if (current() === key) return;
    stack.push(key);
    render();
  }

  function pop() {
    if (stack.length > 1) { stack.pop(); render(); }
  }

  // Wire the drill-down links for every view that defines them.
  Object.keys(VIEWS).forEach(function (key) {
    var v = VIEWS[key];
    var root = sections[key];
    v.links.forEach(function (link) {
      link.cells.forEach(function (cellId) {
        var el = root.querySelector('[data-cell-id="' + cellId + '"]');
        if (!el) return;
        el.classList.add('clickable');
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', link.aria || ('Open ' + VIEWS[link.to].label));
        el.addEventListener('click', function () { push(link.to); });
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); push(link.to); }
        });

        // Dashed pulsing outline to signal the box is clickable.
        var box = el.querySelector('rect, path, ellipse');
        if (box && box.tagName.toLowerCase() === 'rect') {
          var pad = 4;
          var ring = document.createElementNS(NS, 'rect');
          ring.setAttribute('x', +box.getAttribute('x') - pad);
          ring.setAttribute('y', +box.getAttribute('y') - pad);
          ring.setAttribute('width', +box.getAttribute('width') + pad * 2);
          ring.setAttribute('height', +box.getAttribute('height') + pad * 2);
          ring.setAttribute('rx', 12);
          ring.setAttribute('class', 'pulse-ring');
          el.appendChild(ring);
        }
      });
    });
  });

  back.addEventListener('click', pop);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') pop(); });

  // Deep-link support: open directly to a view by hash, with a sensible trail.
  var TRAILS = {
    high: ['high'],
    db: ['high', 'db'],
    ntsb: ['high', 'db', 'ntsb'],
    'avherald-articles': ['high', 'db', 'avherald-articles'],
    'avherald-index': ['high', 'db', 'avherald-articles', 'avherald-index'],
    statsum: ['high', 'db', 'statsum'],
    tax: ['high', 'tax'],
    cls: ['high', 'cls']
  };
  var startHash = (location.hash || '').replace(/^#/, '');
  var startKey = byHash[startHash];
  if (startKey && TRAILS[startKey]) stack = TRAILS[startKey].slice();

  render();
})();
</script>
